name: gaslands-prod

# ============================================================
# Docker Compose - Gaslands Manager (PRODUCTION)
#
# Ce stack ne publie JAMAIS aucun port lui-meme - le reverse proxy Caddy
# (TLS, 80/443) vit dans un stack SEPARE et PARTAGE, docker/edge/, reutilise
# par toute autre application hebergee sur le meme VPS. Postgres, backend et
# frontend ne sont accessibles que via les reseaux Docker internes. pgAdmin
# est entierement retire (utiliser `docker compose -f docker-compose.prod.yml
# exec postgres psql`).
#
# Nom de projet ("gaslands-prod") et container_name distincts de
# docker-compose.yml (dev, "gaslands") : evite toute collision si les deux
# fichiers sont lances sur la meme machine (utile pour tester cette config
# en local avant la bascule VPS, cf. verification ci-dessous).
#
#   internet -> caddy (stack docker/edge/, TLS, 80/443)
#                 |-- /api/* -> gaslands-backend:3000  (reseau edge_net)
#                 `-- /*     -> gaslands-frontend:80   (reseau edge_net)
#   backend -> postgres:5432 (reseau gaslands_db_net, INTERNE - caddy et
#              frontend n'y ont aucune route, meme en cas de compromission)
#
# "gaslands-backend"/"gaslands-frontend" : alias EXPLICITES sur edge_net (cf.
# `networks:` de chaque service ci-dessous) - jamais les noms de service nus
# ("backend"/"frontend"), qui entreraient en collision DNS avec une future
# 2e application partageant le meme reseau edge_net. Voir docker/edge/ pour
# le stack Caddy et docker/caddy/gaslands.caddy pour le bloc de site importe.
#
# Demarrage (stack docker/edge/ deja demarre au prealable, cf. son propre
# README/commentaire) :
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml ps   -> tout "healthy"
#   docker compose -f docker/edge/docker-compose.yml exec caddy \
#     caddy reload --config /etc/caddy/Caddyfile
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: gaslands_prod_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gaslands_db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped

  backend:
    image: ghcr.io/arnaudbracchetti/gaslands-manager-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: gaslands_prod_backend
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME}
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
      CONTENT_DIR: /app/content
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      CORS_ORIGIN: https://${PUBLIC_DOMAIN}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      # Pas de repli ":-latest" ici (contrairement à l'image: ci-dessus, qui
      # en a besoin pour choisir l'image à pull) : une valeur vide doit
      # rester vide, pour que AppService.getVersion() affiche null plutôt
      # qu'une fausse version.
      IMAGE_TAG: ${IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      edge_net:
        aliases:
          - gaslands-backend
      gaslands_db_net: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    init: true
    mem_limit: 512m
    cpus: "1.0"
    restart: unless-stopped

  frontend:
    image: ghcr.io/arnaudbracchetti/gaslands-manager-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: gaslands_prod_frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      edge_net:
        aliases:
          - gaslands-frontend
    healthcheck:
      # 127.0.0.1 explicite, pas "localhost" : wget/busybox resout "localhost"
      # en IPv6 (::1) en priorite dans cette image, alors que nginx n'ecoute
      # qu'en IPv4 (listen 80; = 0.0.0.0:80) - "Connection refused" confirme
      # en testant avec "localhost" avant ce correctif.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.25"
    restart: unless-stopped

networks:
  # Reseau EXTERNE, cree par le stack partage docker/edge/ (jamais par ce
  # fichier) - point de rencontre avec Caddy. Fournit aussi la sortie
  # internet du backend (appel Turnstile, P0-6) : un reseau bridge normal
  # (non "internal") route vers l'exterieur par defaut.
  edge_net:
    external: true
  # "internal: true" : aucune route vers l'exterieur ni depuis un conteneur
  # absent de ce reseau (caddy, frontend) - meme compromis, postgres reste
  # injoignable meme si caddy/frontend etaient compromis.
  gaslands_db_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
