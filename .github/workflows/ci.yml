name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # tsconfig.base.json porte composite/emitDeclarationOnly (project references Nx),
      # incompatibles avec Angular - cf. CLAUDE.md, "Dépannage Nx + TypeScript".
      NX_IGNORE_UNSUPPORTED_TS_SETUP: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache npm. Version alignée sur .nvmrc (environnement de dev local).
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Calcule base/head pour `nx affected` et `format:check` (sans Nx Cloud).
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check

      # Pas de Nx Cloud sur ce dépôt : exécution locale au runner.
      # - `typecheck` exclu : la cible inférée par @nx/js (tsc --build --emitDeclarationOnly)
      #   ne correspond pas aux builds réels (builder Angular, webpack transpileOnly côté
      #   backend) et échoue sur des écarts connus (entités TypeORM, globals Vitest).
      #   Le build frontend type-check déjà le code Angular.
      # - e2e exclus : ils demandent PostgreSQL + navigateurs Playwright (cf. skill e2e-testing).
      - run: npx nx affected -t lint test build
