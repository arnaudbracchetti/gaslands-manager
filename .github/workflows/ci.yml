name: CI

# Workflow unique : vérification du code à chaque push sur main et chaque PR,
# puis publication des images Docker uniquement sur un tag de version posé sur
# un commit de main, et uniquement si la vérification est verte.
# Cf. issue #25 (« CI (un seul workflow) ») et docs/adr/0001-*.md.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # Base jetable pour backend:migration:check (concordance entités/migrations).
    # Postgres 16 : même version majeure que la prod (docker-compose.prod.yml).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gaslands
          POSTGRES_PASSWORD: gaslands
          POSTGRES_DB: gaslands_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaslands"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tsconfig.base.json porte composite/emitDeclarationOnly (project references Nx),
      # incompatibles avec Angular - cf. CLAUDE.md, "Dépannage Nx + TypeScript".
      NX_IGNORE_UNSUPPORTED_TS_SETUP: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache npm. Version alignée sur .nvmrc (environnement de dev local).
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Calcule base/head pour `format:check` (sans Nx Cloud).
      - uses: nrwl/nx-set-shas@v4

      # Fichiers touchés uniquement : de nombreux fichiers de doc historiques ne
      # sont pas formatés, un `--all` échouerait sans rapport avec le changement.
      - run: npx nx format:check

      # Pas de Nx Cloud sur ce dépôt : exécution locale au runner.
      # `run-many` (tous les projets) plutôt que `affected` : sur un tag posé sur
      # un commit de main déjà vérifié, `affected` ne verrait rien à exécuter et
      # la publication partirait sans vérification réelle.
      # - `typecheck` exclu : la cible inférée par @nx/js (tsc --build --emitDeclarationOnly)
      #   ne correspond pas aux builds réels (builder Angular, webpack transpileOnly côté
      #   backend) et échoue sur des écarts connus (entités TypeORM, globals Vitest).
      #   Le build frontend type-check déjà le code Angular.
      # - e2e exclus : ils demandent PostgreSQL + navigateurs Playwright (cf. skill e2e-testing).
      - run: npx nx run-many -t lint test build

      # Les migrations postérieures à la dernière en prod sont-elles additives ?
      # Analyse statique du source, sans base (cf. docs/ARCHITECTURE.md §4).
      - run: npx nx run backend:migration:lint

      # Les migrations reproduisent-elles exactement les entités TypeORM ?
      # Connexion lue dans l'environnement (pas de .env en CI).
      - run: npx nx run backend:migration:check
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_USER: gaslands
          DATABASE_PASSWORD: gaslands
          DATABASE_NAME: gaslands_migration_check

  # Publication des images, seulement pour un tag de version et après une
  # vérification verte. Runner ubuntu-latest = amd64 natif (même arch que le VPS
  # de production), aucune cross-compilation. Le token GHCR (GITHUB_TOKEN) est
  # fourni par le workflow, aucun secret à configurer.
  image:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # La prod ne reçoit que du code fusionné : un tag posé hors de main
      # (branche de travail, commit orphelin) ne publie aucune image.
      - name: Vérifier que le commit taggé est sur main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ($GITHUB_SHA) n'est pas sur main : aucune image publiée."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag unique = numéro de version : plus de `latest`, la version déployée
      # est toujours explicite (docker-compose.prod.yml exige IMAGE_TAG).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          push: true
          tags: ghcr.io/arnaudbracchetti/gaslands-manager-${{ matrix.target }}:${{ github.ref_name }}
