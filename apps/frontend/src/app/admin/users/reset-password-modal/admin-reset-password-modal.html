<!--
  AdminResetPasswordModal — dialog "Réinitialiser le mot de passe" d'un compte
  tiers. Chrome porté par ModalShell (mode "action") — cf. commentaire
  équivalent dans change-password-modal.html pour le rôle du bouton submit
  caché (soumission au clavier).
-->
<app-modal-shell
  ariaLabel="Réinitialiser le mot de passe"
  variant="primary"
  [confirmLabel]="confirmLabel()"
  cancelLabel="Annuler"
  [confirmDisabled]="submitDisabled()"
  (confirmed)="onSubmit()"
  (cancelled)="cancelled.emit()">
  <h3 class="arpm-title">Réinitialiser le mot de passe de {{ user().callName }}</h3>

  @if (error()) {
    <div class="auth-error" role="alert">{{ error() }}</div>
  }
  @if (passwordMismatch()) {
    <div class="auth-error" role="alert">Les mots de passe ne correspondent pas</div>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="arpm-password-pair">
      <div class="form-group">
        <label for="arpm-new-password">Nouveau mot de passe</label>
        <input
          id="arpm-new-password"
          type="password"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
          name="newPassword"
          autocomplete="new-password"
          placeholder="6 caractères minimum"
          required
        />
      </div>

      <div class="form-group">
        <label for="arpm-confirm-new-password">Confirmer le nouveau mot de passe</label>
        <input
          id="arpm-confirm-new-password"
          type="password"
          [ngModel]="confirmNewPassword()"
          (ngModelChange)="confirmNewPassword.set($event)"
          name="confirmNewPassword"
          autocomplete="new-password"
          required
        />
      </div>
    </div>

    <button type="submit" class="arpm-hidden-submit" tabindex="-1" aria-hidden="true"></button>
  </form>
</app-modal-shell>
