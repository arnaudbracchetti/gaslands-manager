<!--
  ChangePasswordModal — dialog "Changer le mot de passe", indépendant du
  dialog "Détails du compte" (UserDetailsModal). Chrome porté par ModalShell
  (mode "action") — cf. commentaire équivalent dans user-details-modal.html
  pour le rôle du bouton submit caché (soumission au clavier).
-->
<app-modal-shell
  ariaLabel="Changer le mot de passe"
  variant="primary"
  [confirmLabel]="confirmLabel()"
  cancelLabel="Fermer"
  [confirmDisabled]="submitDisabled()"
  (confirmed)="onSubmit()"
  (cancelled)="cancelled.emit()">
  <h3 class="cpm-title">Changer le mot de passe</h3>

  @if (error()) {
    <div class="auth-error" role="alert">{{ error() }}</div>
  }
  @if (passwordMismatch()) {
    <div class="auth-error" role="alert">Les mots de passe ne correspondent pas</div>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="cpm-current-password">Mot de passe actuel</label>
      <input
        id="cpm-current-password"
        type="password"
        [ngModel]="currentPassword()"
        (ngModelChange)="currentPassword.set($event)"
        name="currentPassword"
        autocomplete="current-password"
        required
      />
    </div>

    <div class="cpm-password-pair">
      <div class="form-group">
        <label for="cpm-new-password">Nouveau mot de passe</label>
        <input
          id="cpm-new-password"
          type="password"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
          name="newPassword"
          autocomplete="new-password"
          placeholder="6 caractères minimum"
          required
        />
      </div>

      <div class="form-group">
        <label for="cpm-confirm-new-password">Confirmer le nouveau mot de passe</label>
        <input
          id="cpm-confirm-new-password"
          type="password"
          [ngModel]="confirmNewPassword()"
          (ngModelChange)="confirmNewPassword.set($event)"
          name="confirmNewPassword"
          autocomplete="new-password"
          required
        />
      </div>
    </div>

    <button type="submit" class="cpm-hidden-submit" tabindex="-1" aria-hidden="true"></button>
  </form>
</app-modal-shell>
