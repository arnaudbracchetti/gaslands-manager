<!--
  UserDetailsModal — dialog "Détails du compte".

  Deux sous-formulaires indépendants (Informations / Mot de passe), chacun
  avec son propre bouton, sa propre erreur et son propre état de sauvegarde
  — ils correspondent à deux appels backend distincts avec des échecs
  indépendants (email pris vs mot de passe actuel incorrect).
-->
<div class="udm-overlay" role="dialog" aria-modal="true" aria-label="Détails du compte">
  <div class="udm-modal">
    <div class="udm-modal__header">
      <h4 class="udm-modal__title">Détails du compte</h4>
      <button type="button" class="udm-close" aria-label="Fermer" (click)="onClose()">✕</button>
    </div>

    <!-- Section Informations -->
    <section class="udm-section">
      <h5 class="udm-section__title">Informations</h5>

      @if (profileError()) {
        <div class="auth-error" role="alert">{{ profileError() }}</div>
      }

      <form (ngSubmit)="onProfileSubmit()">
        <div class="form-group">
          <label for="udm-first-name">Prénom</label>
          <input
            id="udm-first-name"
            type="text"
            [ngModel]="firstName()"
            (ngModelChange)="firstName.set($event)"
            name="firstName"
            required
          />
        </div>

        <div class="form-group">
          <label for="udm-last-name">Nom</label>
          <input
            id="udm-last-name"
            type="text"
            [ngModel]="lastName()"
            (ngModelChange)="lastName.set($event)"
            name="lastName"
            required
          />
        </div>

        <div class="form-group">
          <label for="udm-pseudo">Pseudo</label>
          <input
            id="udm-pseudo"
            type="text"
            [ngModel]="pseudo()"
            (ngModelChange)="pseudo.set($event)"
            name="pseudo"
            autocomplete="nickname"
            required
          />
        </div>

        <div class="form-group">
          <label for="udm-email">Email</label>
          <input
            id="udm-email"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="udm-readonly">
          <span class="udm-readonly__label">Rôle</span>
          <span class="udm-readonly__value">{{ roleLabel() }}</span>
        </div>

        <button type="submit" class="udm-submit" [disabled]="profileSubmitDisabled()">
          @if (profileSaving()) {
            Enregistrement…
          } @else {
            Enregistrer
          }
        </button>
      </form>
    </section>

    <!-- Section Mot de passe -->
    <section class="udm-section">
      <h5 class="udm-section__title">Mot de passe</h5>

      @if (passwordError()) {
        <div class="auth-error" role="alert">{{ passwordError() }}</div>
      }
      @if (passwordMismatch()) {
        <div class="auth-error" role="alert">Les mots de passe ne correspondent pas</div>
      }

      <form (ngSubmit)="onPasswordSubmit()">
        <div class="form-group">
          <label for="udm-current-password">Mot de passe actuel</label>
          <input
            id="udm-current-password"
            type="password"
            [ngModel]="currentPassword()"
            (ngModelChange)="currentPassword.set($event)"
            name="currentPassword"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="form-group">
          <label for="udm-new-password">Nouveau mot de passe</label>
          <input
            id="udm-new-password"
            type="password"
            [ngModel]="newPassword()"
            (ngModelChange)="newPassword.set($event)"
            name="newPassword"
            autocomplete="new-password"
            placeholder="6 caractères minimum"
            required
          />
        </div>

        <div class="form-group">
          <label for="udm-confirm-new-password">Confirmer le nouveau mot de passe</label>
          <input
            id="udm-confirm-new-password"
            type="password"
            [ngModel]="confirmNewPassword()"
            (ngModelChange)="confirmNewPassword.set($event)"
            name="confirmNewPassword"
            autocomplete="new-password"
            required
          />
        </div>

        <button type="submit" class="udm-submit" [disabled]="passwordSubmitDisabled()">
          @if (passwordSaving()) {
            Enregistrement…
          } @else {
            Changer le mot de passe
          }
        </button>
      </form>
    </section>
  </div>
</div>
