<!--
  UserDetailsModal — dialog "Détails du compte" (Informations uniquement —
  le changement de mot de passe vit dans sa propre modale, ChangePasswordModal).
  Chrome (panel métal + coins + bande HazardTape + boutons) porté par
  ModalShell (mode "action") — le bouton de confirmation, hors du <form>
  ci-dessous, appelle directement onProfileSubmit(). Le bouton submit caché
  dans le <form> ne sert qu'à préserver la soumission au clavier (Entrée dans
  un champ) : un formulaire à plusieurs champs sans AUCUN bouton submit ne
  déclenche pas fiablement la soumission implicite.
-->
<app-modal-shell
  ariaLabel="Détails du compte"
  variant="primary"
  [confirmLabel]="confirmLabel()"
  cancelLabel="Fermer"
  [confirmDisabled]="profileSubmitDisabled()"
  (confirmed)="onProfileSubmit()"
  (cancelled)="cancelled.emit()">
  <h3 class="udm-title">Détails du compte</h3>

  <section class="udm-section">
    <h5 class="udm-section__title">Informations</h5>

    @if (profileError()) {
      <div class="auth-error" role="alert">{{ profileError() }}</div>
    }

    <form (ngSubmit)="onProfileSubmit()">
      <div class="form-grid">
        <div class="form-group">
          <label for="udm-first-name">Prénom</label>
          <input
            id="udm-first-name"
            type="text"
            [ngModel]="firstName()"
            (ngModelChange)="firstName.set($event)"
            name="firstName"
            required
          />
        </div>

        <div class="form-group">
          <label for="udm-last-name">Nom</label>
          <input
            id="udm-last-name"
            type="text"
            [ngModel]="lastName()"
            (ngModelChange)="lastName.set($event)"
            name="lastName"
            required
          />
        </div>

        <div class="form-group form-group--full">
          <label for="udm-pseudo">Pseudo</label>
          <input
            id="udm-pseudo"
            type="text"
            [ngModel]="pseudo()"
            (ngModelChange)="pseudo.set($event)"
            name="pseudo"
            autocomplete="nickname"
            required
          />
        </div>

        <div class="form-group form-group--full">
          <label for="udm-email">Email</label>
          <input
            id="udm-email"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <button type="submit" class="udm-hidden-submit" tabindex="-1" aria-hidden="true"></button>
    </form>
  </section>
</app-modal-shell>
