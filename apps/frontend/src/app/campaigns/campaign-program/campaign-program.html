<!-- Programme Télé — section de la page de détail d'une saison -->
<div class="campaign-program">

  <div class="campaign-program__header">
    <h2>Programme Télé</h2>
    @if (canManage() && !anyModalOpen()) {
      <button type="button" class="btn-primary campaign-program__add" (click)="openCreate()">
        <app-icon concept="ajouter" size="sm" /> Ajouter une partie
      </button>
    }
  </div>

  @if (error()) {
    <div class="campaign-detail-error">{{ error() }}</div>
  }

  @if (showForm()) {
    <app-game-form
      [scenarios]="scenarios()"
      [game]="editingGame()"
      [saving]="saving()"
      (saved)="onSaved($event)"
      (formCancel)="cancelForm()" />
  }

  @if (recordingGame()) {
    <app-game-result-wizard
      [game]="recordingGame()!"
      [participants]="participants()"
      [saving]="savingResult()"
      [participantVehicles]="participantVehicles()"
      [resultRecorded]="wizardResultRecorded()"
      [wreckOutcomes]="wreckOutcomes()"
      [wreckDescriptions]="wreckDescriptions()"
      [incomeResults]="incomeResults()"
      [resolving]="resolving()"
      [finalizingGame]="finalizingGame()"
      [resetting]="resettingResult()"
      (batchReady)="onBatchReady($event)"
      (incomeRollRequested)="onIncomeRollRequested($event)"
      (wreckRollRequested)="onWreckRollRequested($event)"
      (wizardCompleted)="onWizardCompleted()"
      (formCancel)="onWizardCancelled()"
      (presentParticipantsChanged)="onPresentParticipantsChanged($event)" />
  }

  @if (loading()) {
    <p class="campaign-program__loading">Chargement du programme...</p>
  } @else {
    <app-game-list
      [games]="games()"
      [canManage]="canManage() && !anyModalOpen()"
      [canRecord]="canManage() && !anyModalOpen()"
      (editGame)="onEdit($event)"
      (deleteGame)="onDelete($event)"
      (recordGame)="onRecordGame($event)"
      (openJournal)="onOpenJournal($event)"
      (openAtelier)="onOpenAtelier()"
      (reorderRequested)="onReorder($event)" />
  }

  @if (journalGame()) {
    <app-game-journal-modal
      [game]="journalGame()!"
      [entries]="journalEntries()"
      [loading]="loadingJournal()"
      (closed)="onJournalClosed()" />
  }

  @if (pendingDeleteGame()) {
    <app-confirm-modal
      [message]="'Supprimer la partie &quot;' + pendingDeleteGame()!.scenarioName + '&quot; du programme ?'"
      confirmLabel="Supprimer"
      (confirmed)="onConfirmDelete()"
      (cancelled)="pendingDeleteGame.set(null)" />
  }

</div>
