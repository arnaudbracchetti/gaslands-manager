<div class="vcp-page">

  <div class="vcp-top">
    <app-breadcrumb [crumbs]="breadcrumbs()" />

    <div class="vcp-header">
      <h1>{{ vehicleName() || 'Gestion de l\'équipement' }}</h1>
      @if (equipmentManagerRef()) {
        <button class="vcp-toggle" type="button" (click)="toggleShowUnavailable()">
          @if (showUnavailable()) {
            Masquer les indisponibles
          } @else {
            Afficher les indisponibles ({{ hiddenCount() }})
          }
        </button>
      }
    </div>
  </div>

  @if (loading()) {
    <p class="vcp-status vcp-status--loading">Chargement…</p>
  } @else if (error()) {
    <p class="vcp-status vcp-status--error">{{ error() }}</p>
  } @else if (vehicle(); as v) {
    @if (sponsorCatalog(); as catalog) {
      <app-equipment-manager
        [vehicle]="v"
        [sponsorCatalog]="catalog"
        [budget]="budget()"
        [allowResale]="true"
        [campaignId]="campaignId"
        [chocs]="targetWorkshopVehicle()?.chocs ?? null"
        [sequellas]="targetWorkshopVehicle()?.sequellas ?? []"
        (vehicleChanged)="onVehicleChanged()"
        (sequellaChanged)="onVehicleChanged()"
      />
    }
  }

</div>
