<!--
  ChangeTeamModal — sélection d'équipe. Chrome délégué à ModalShell (mode
  "action" par défaut). `variant="primary"` reproduit la couleur ambre
  (--tb-danger) du bouton Valider actuel — le variant "danger" par défaut de
  ModalShell rend en rouille, pas la couleur voulue ici (action réversible,
  pas destructive).
-->
<app-modal-shell
  ariaLabel="Choisir votre équipe"
  variant="primary"
  confirmLabel="Valider"
  (confirmed)="onConfirm()"
  (cancelled)="cancelled.emit()">

  <h4 class="ctm-modal__title">Choisir votre équipe</h4>

  <select
    class="ctm-modal__select"
    [value]="selectedTeamId() ?? ''"
    (change)="onSelectChange($any($event.target).value)">
    @if (isOrganizer()) {
      <option value="">— Sans équipe —</option>
    }
    @for (team of teams(); track team.id) {
      <option
        [value]="team.id"
        [disabled]="team.isEngaged && team.id !== currentTeamId()">
        {{ team.name }}{{ team.isEngaged && team.id !== currentTeamId() ? ' (déjà engagée)' : '' }}
      </option>
    }
  </select>

</app-modal-shell>
