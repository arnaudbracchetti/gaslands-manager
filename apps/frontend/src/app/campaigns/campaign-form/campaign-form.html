<!-- Formulaire de création d'une saison. Chrome délégué à ModalShell (mode "action"). -->
<app-modal-shell
  ariaLabel="Nouvelle saison"
  variant="primary"
  [confirmLabel]="saving() ? 'Enregistrement...' : 'Enregistrer'"
  [confirmDisabled]="saving()"
  (confirmed)="saveForm()"
  (cancelled)="cancelForm()">

  <h2><app-icon concept="ajouter" size="lg" /> Nouvelle saison</h2>

  @if (formError()) {
    <div class="form-error">{{ formError() }}</div>
  }

  <div class="form-grid">

    <!-- Nom de la saison (obligatoire) -->
    <div class="form-group">
      <label for="campaign-name">Nom de la saison *</label>
      <input
        id="campaign-name"
        type="text"
        placeholder="Ex : Coupe Verney"
        [ngModel]="formName()"
        (ngModelChange)="formName.set($event)" />
    </div>

    <!-- Budget des équipes (jerricans) -->
    <div class="form-group">
      <label for="campaign-budget">Budget des équipes (jerricans) *</label>
      <input
        id="campaign-budget"
        type="number"
        min="1"
        max="999"
        [ngModel]="formBudget()"
        (ngModelChange)="formBudget.set(+$event)" />
      <p class="form-hint">Seules les équipes dont le coût total tient dans ce budget pourront rejoindre la campagne.</p>
    </div>

    <!-- Équipe engagée (optionnelle) -->
    <div class="form-group form-group--full">
      <label for="campaign-team">Mon équipe engagée</label>
      @if (teams().length > 0) {
        <select
          id="campaign-team"
          [ngModel]="formTeamId()"
          (ngModelChange)="formTeamId.set($event ? +$event : null)">
          <option [ngValue]="null">— Sans équipe —</option>
          @for (team of teams(); track team.id) {
            <option [value]="team.id" [disabled]="(team.isEngaged ?? false) || ineligibleTeamIds().has(team.id)">
              {{ team.name }}{{ team.isEngaged ? ' (déjà engagée)' : ineligibleTeamIds().has(team.id) ? ' (hors budget)' : '' }}
            </option>
          }
        </select>
      } @else {
        <p class="form-hint">Vous n'avez pas encore d'équipe. Vous pouvez en créer une ci-dessous ou rejoindre la saison sans équipe.</p>
      }

      <app-quick-team-create [saving]="creatingTeam()" (created)="teamCreated.emit($event)" />
    </div>

  </div>

</app-modal-shell>
