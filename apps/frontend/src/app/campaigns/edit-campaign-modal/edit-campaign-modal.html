<!-- Formulaire de modification d'une saison EN_CONSTRUCTION. Chrome délégué à ModalShell (mode "action"). -->
<app-modal-shell
  ariaLabel="Modifier la saison"
  variant="primary"
  [confirmLabel]="saving() ? 'Enregistrement...' : 'Enregistrer'"
  [confirmDisabled]="saving() || !canEditNameBudget()"
  (confirmed)="onConfirm()"
  (cancelled)="cancelled.emit()">

  <h2><app-icon concept="modifier" size="lg" /> Modifier la saison</h2>

  @if (displayError()) {
    <div class="form-error">{{ displayError() }}</div>
  }

  <!-- [readonly], pas [disabled] : FormsModule pilote lui-même la propriété DOM
       `disabled` d'un champ lié par [ngModel] (setDisabledState, état du
       FormControl sous-jacent, toujours "enabled" ici) et écrase silencieusement
       toute tentative de la fixer via une liaison séparée — [readonly] n'est
       géré par aucun ControlValueAccessor, donc jamais réécrit. -->
  <div class="form-grid">

    <div class="form-group">
      <label for="edit-campaign-name">Nom de la saison *</label>
      <input
        id="edit-campaign-name"
        type="text"
        [class.is-readonly]="!canEditNameBudget()"
        [readonly]="!canEditNameBudget()"
        [ngModel]="formName()"
        (ngModelChange)="formName.set($event)" />
    </div>

    <div class="form-group">
      <label for="edit-campaign-budget">Budget des équipes (jerricans) *</label>
      <input
        id="edit-campaign-budget"
        type="number"
        min="1"
        max="999"
        [class.is-readonly]="!canEditNameBudget()"
        [readonly]="!canEditNameBudget()"
        [ngModel]="formBudget()"
        (ngModelChange)="formBudget.set(+$event)" />
    </div>

    @if (!canEditNameBudget()) {
      <div class="form-group form-group--full">
        <p class="form-hint">Le nom et le budget ne sont modifiables qu'en construction.</p>
      </div>
    }

    <!-- Règles maison — aucune contrainte d'état, contrairement à nom/budget ci-dessus. -->
    <div class="form-group form-group--full">
      @if (houseRulesError()) {
        <div class="form-error">{{ houseRulesError() }}</div>
      }
      <app-house-rules-selector
        [definitions]="houseRuleCatalog()"
        [enabledKeys]="campaign().houseRules"
        [locked]="savingHouseRules()"
        (toggled)="houseRuleToggled.emit($event)" />
    </div>

  </div>

</app-modal-shell>
