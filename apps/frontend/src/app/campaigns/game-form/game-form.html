<!-- Formulaire d'ajout / édition d'une partie au Programme Télé. Chrome délégué à ModalShell (mode "action"). -->
<app-modal-shell
  [ariaLabel]="isEdit() ? 'Modifier la partie' : 'Nouvelle partie'"
  variant="primary"
  [confirmLabel]="saving() ? 'Enregistrement...' : 'Enregistrer'"
  [confirmDisabled]="saving()"
  (confirmed)="saveForm()"
  (cancelled)="cancelForm()">

  <h3>
    @if (isEdit()) {
      <app-icon concept="modifier" size="md" /> Modifier la partie
    } @else {
      <app-icon concept="ajouter" size="md" /> Nouvelle partie
    }
  </h3>

  @if (formError()) {
    <div class="form-error">{{ formError() }}</div>
  }

  <div class="form-group">
    <label for="game-scenario">Scénario *</label>
    @if (scenarios().length > 0) {
      <select
        id="game-scenario"
        [ngModel]="formScenarioId()"
        (ngModelChange)="formScenarioId.set($event)">
        <option value="">— Choisir un scénario —</option>
        @for (scenario of scenarios(); track scenario.nom_interne) {
          <option [value]="scenario.nom_interne">
            {{ scenario.nom }} ({{ scenario.type === 'EVENEMENT_TELE' ? 'Événement Télévisé' : 'Escarmouche' }})
          </option>
        }
      </select>
    } @else {
      <p class="form-hint">Aucun scénario disponible.</p>
    }
  </div>

</app-modal-shell>
