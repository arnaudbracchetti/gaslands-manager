<!-- Wizard de fin de partie : 3 écrans séquentiels, en popup -->
@let scenarioName = game().scenarioName;
<div class="grw-overlay" role="dialog" aria-modal="true"
     [attr.aria-label]="'Fin de partie - ' + scenarioName">
  <div class="grw-modal">
    <h3 class="grw-modal__title">🎯 Fin de partie - {{ scenarioName }}</h3>

    <ol class="grw-modal__steps">
      <li [class.grw-modal__step--active]="currentStep() === 1" [class.grw-modal__step--done]="currentStep() > 1">
        1. Classement
      </li>
      <li [class.grw-modal__step--active]="currentStep() === 2" [class.grw-modal__step--done]="currentStep() > 2">
        2. Épaves infligées
      </li>
      <li [class.grw-modal__step--active]="currentStep() === 3">
        3. Table des Épaves
      </li>
    </ol>

    <div class="grw-modal__body">
      @switch (currentStep()) {
        @case (1) {
          <app-ranking-step
            [game]="game()"
            [participants]="participants()"
            [saving]="false"
            (next)="onRankingNext($event)"
            (presentParticipantsChanged)="onPresentParticipantsChanged($event)"
            (formCancel)="onCancel()" />
        }
        @case (2) {
          <app-wreck-designation-step
            [presentParticipants]="presentParticipantsForDesignation()"
            [participantVehicles]="participantVehicles()"
            [saving]="saving()"
            (next)="onDesignationNext($event)"
            (back)="onDesignationBack()"
            (formCancel)="onCancel()" />
        }
        @case (3) {
          <app-wreck-resolution-step
            [wreckedVehicles]="wreckedVehicles()"
            [vehicleLabels]="vehicleLabels()"
            [destroyedBy]="destroyedBy()"
            [outcomes]="wreckOutcomes()"
            [descriptions]="wreckDescriptions()"
            [finalizing]="finalizingGame()"
            (completed)="onWreckCompleted()" />
        }
      }
    </div>
  </div>
</div>
