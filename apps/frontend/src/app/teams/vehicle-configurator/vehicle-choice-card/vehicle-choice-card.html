<!-- Carte de présentation d'un véhicule du catalogue — cf. en-tête de vehicle-choice-card.ts -->
<div class="choice-card" [class.choice-card--unavailable]="!disponible()">

  <span class="choice-card__watermark" aria-hidden="true">{{ indexFormate() }}</span>

  <div class="choice-card__header">
    <h3 class="choice-card__name">{{ vehicule().nom }}</h3>
    <span class="choice-card__weight">{{ vehicule().poids }}</span>
  </div>

  <!-- [innerHTML] : description convertie en HTML au chargement du catalogue
       (CatalogService.onModuleInit, marked) — <div> et non <p> car le HTML
       généré contient déjà ses propres balises (<p>, <ul>...), cf.
       vehicle-choice-card.scss (::ng-deep). -->
  <div class="choice-card__description" [innerHTML]="vehicule().description"></div>

  <!-- Statistiques essentielles — cf. SPECIFICATION.md §5, modèle Vehicule -->
  <div class="choice-card__stats">
    <span class="stat" title="Carrosserie"><app-icon concept="carrosserie" size="sm" /> {{ vehicule().carrosserie }}</span>
    <span class="stat" title="Manœuvrabilité"><app-icon concept="maniabilite" size="sm" /> {{ vehicule().manoeuvrabilite }}</span>
    <span class="stat" title="Vitesse maximale"><app-icon concept="vitesse" size="sm" /> {{ vehicule().vitesse_max }}</span>
    <span class="stat" title="Équipage">👥 {{ vehicule().equipage }}</span>
    <app-slot-gauge [used]="0" [total]="vehicule().emplacements" />
  </div>

  <div class="choice-card__footer">
    <span class="choice-card__price">{{ vehicule().prix }} <app-icon concept="prix" size="sm" /></span>
    @if (disponible()) {
      <button
        class="choice-card__choose"
        type="button"
        (click)="onChoose()">
        Choisir ce véhicule
      </button>
    } @else {
      <!-- Refus définitif — la raison vient du backend (RuleResult.reason),
           cf. Team.canAddVehicle. Même convention que EquipmentOption.__reason. -->
      <p class="choice-card__reason">{{ raison() }}</p>
    }
  </div>

</div>
