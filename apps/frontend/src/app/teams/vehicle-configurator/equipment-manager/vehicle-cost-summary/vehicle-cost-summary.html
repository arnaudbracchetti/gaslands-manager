<!--
  VehicleCostSummary — nom du véhicule, emplacements et coût (ex partie haute
  de `.em-current__header`, après `app-team-budget`).
-->
<h3 class="vcs-name" [title]="vehicleName()">{{ vehicleName() }}</h3>

<div class="vcs-slots">
  <span class="vcs-slots__label">Emplacements</span>
  <app-slot-gauge [used]="emplacementsUtilises()" [total]="emplacementsTotal()" size="md" />
</div>

@if (chocs() !== null) {
  <div class="vcs-chocs" title="Chocs accumulés par ce véhicule (Table des Épaves) — monnaie des séquelles">
    <app-icon concept="chocs" size="sm" /> Chocs : <strong>{{ chocs() }}</strong>
  </div>
}

<div class="vcs-cost">
  <p class="vcs-cost-row">
    <span>Base</span>
    <span>{{ coutBase() }} <app-icon concept="argent" size="xs" /></span>
  </p>
  <p class="vcs-cost-row">
    <span>+ Équipement</span>
    <span>{{ coutEquipement() }} <app-icon concept="argent" size="xs" /></span>
  </p>
  <p class="vcs-cost-row vcs-cost-row--total">
    <span>Total</span>
    <span>{{ coutTotal() }} <app-icon concept="argent" size="xs" /></span>
  </p>
</div>
