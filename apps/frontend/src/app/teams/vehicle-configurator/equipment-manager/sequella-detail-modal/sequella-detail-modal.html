<!--
  SequellaDetailModal — détail d'une séquelle (cf. en-tête .ts). Mirroir
  d'EquipmentDetailModal, chrome délégué à ModalShell, mode "consultation".
-->
<app-modal-shell
  mode="consultation"
  size="xl"
  [ariaLabel]="sequella().nom"
  (cancelled)="closed.emit()">

  <header class="sdm-modal__header">
    <h3 class="sdm-modal__name">{{ sequella().nom }}</h3>
    <span class="sdm-modal__badge" title="Coût en Chocs">
      <app-icon concept="chocs" size="sm" /> {{ sequella().chocsCost }}
    </span>
  </header>

  @if (sequella().description) {
    <!-- [innerHTML] : description/regles convertis en HTML au chargement du
         catalogue (CatalogService.onModuleInit, marked). -->
    <div class="sdm-modal__description" [innerHTML]="sequella().description"></div>
  }

  @if (sequella().regles) {
    <section class="sdm-modal__regles">
      <h4 class="sdm-modal__regles-title">Règles</h4>
      <div [innerHTML]="sequella().regles"></div>
    </section>
  }

  @if (!sequella().disponible) {
    <p class="sdm-modal__reason">{{ sequella().raison }}</p>
  }

</app-modal-shell>
