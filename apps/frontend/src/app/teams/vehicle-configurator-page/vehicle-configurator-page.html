<!--
  Page de construction/édition d'un véhicule.
  Le fil d'Ariane dépend de returnTo : TeamEditPage ou liste des équipes.
-->
<div class="vcp-page">

  <div class="vcp-top">
    <app-breadcrumb [crumbs]="breadcrumbs()" />

    <div class="vcp-header">
      <h1>{{ vehicleId() === null ? 'Ajouter un véhicule' : "Gérer l'équipement du véhicule" }}</h1>
      @if (hasEquipmentManager()) {
        <button class="vcp-toggle" type="button" (click)="toggleShowUnavailable()">
          @if (showUnavailable()) {
            Masquer les indisponibles
          } @else {
            Afficher les indisponibles ({{ hiddenCount() }})
          }
        </button>
      }
    </div>
  </div>

  @if (loading()) {
    <p class="vcp-status vcp-status--loading">Chargement…</p>
  } @else if (error()) {
    <p class="vcp-status vcp-status--error">{{ error() }}</p>
  } @else if (team(); as t) {
    <app-vehicle-configurator
      [team]="t"
      [vehicleId]="vehicleId()"
      (done)="onDone()" />
  }

</div>
