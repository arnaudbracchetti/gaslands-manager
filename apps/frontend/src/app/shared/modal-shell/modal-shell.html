<!--
  ModalShell — chrome commun (overlay + panel métal + coins + bande HazardTape
  + footer d'actions), contenu laissé entièrement au consommateur via
  <ng-content>. Un clic À L'INTÉRIEUR de la boîte (`.ms-modal`) déclenche
  aussi le `(click)` de `.ms-overlay` par bubbling naturel - plutôt que de
  poser un second handler `(click)="$event.stopPropagation()"` sur `.ms-modal`
  (un div sans action propre, donc non focusable/non clavier-opérable :
  viole `click-events-have-key-events`/`interactive-supports-focus`),
  `onOverlayClick($event)` compare `event.target`/`event.currentTarget` et
  ignore tout clic dont la cible n'est pas l'overlay lui-même.

  Coins d'enregistrement en `<span>` réels (pas ::before/::after) : la classe
  .tb-grain (texture de grain, styles.scss) définit elle-même un ::after sur
  l'élément qu'elle décore — un ::after de coin sur .ms-modal entrerait en
  collision avec celui de .tb-grain (un seul ::after possible par élément) et
  rendrait le coin bas-droit invisible (constaté : opacity/inset écrasés par
  la règle du grain). Deux éléments dédiés évitent structurellement le conflit.

  cdkTrapFocus + cdkTrapFocusAutoCapture sur .ms-modal : sans focus trap,
  Tab pouvait sortir de la boîte de dialogue vers le reste de la page (le
  shell n'a pas de bouton "ouvrir" séparé à gérer - chaque consommateur
  monte/démonte ModalShell via @if, autoCapture déplace donc le focus au
  montage et le restaure au démontage).
-->
<div
  class="ms-overlay"
  role="dialog"
  aria-modal="true"
  tabindex="-1"
  [attr.aria-label]="ariaLabel()"
  (click)="onOverlayClick($event)"
  (keydown.escape)="onOverlayClick()">
  <div
    class="ms-modal tb-grain"
    [class.ms-modal--primary]="variant() === 'primary'"
    [class.ms-modal--lg]="size() === 'lg'"
    [class.ms-modal--xl]="size() === 'xl'"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true">
    <span class="ms-corner ms-corner--tl" aria-hidden="true"></span>
    <span class="ms-corner ms-corner--br" aria-hidden="true"></span>
    <div class="ms-modal__tape"></div>

    <div class="ms-modal__body">
      <ng-content></ng-content>

      <div class="ms-modal__actions">
        <button class="ms-modal__cancel" type="button" (click)="cancelled.emit()">
          {{ cancelLabel() }}
        </button>
        @if (mode() === 'action') {
          <button
            class="ms-modal__confirm"
            type="button"
            [disabled]="confirmDisabled()"
            (click)="confirmed.emit()">
            {{ confirmLabel() }}
          </button>
        }
      </div>
    </div>
  </div>
</div>
