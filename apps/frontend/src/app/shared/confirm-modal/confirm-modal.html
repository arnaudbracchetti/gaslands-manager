<!--
  ConfirmModal — overlay de confirmation générique.
  Chrome (panel métal + coins + bande HazardTape + boutons) porté par
  ModalShell (mode "action", par défaut) — ce composant ne garde que le
  message projeté.
-->
<app-modal-shell
  [ariaLabel]="message()"
  [variant]="variant()"
  [confirmLabel]="confirmLabel()"
  [cancelLabel]="cancelLabel()"
  (confirmed)="confirmed.emit()"
  (cancelled)="cancelled.emit()">
  <p class="cm-message">{{ message() }}</p>
</app-modal-shell>
