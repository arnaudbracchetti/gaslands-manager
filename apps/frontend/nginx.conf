# ============================================================
# Configuration nginx — Frontend Angular (Gaslands)
#
# nginx sert exclusivement les fichiers statiques (HTML/JS/CSS
# compilés) - plus de proxy /api/* ici.
#
# En développement, le proxy est géré par proxy.conf.cjs (serveur de
# dev Angular). En production Docker, c'est Caddy (edge, cf.
# docker/caddy/Caddyfile) qui route /api/* directement vers le
# service "backend" - jamais via ce conteneur nginx : un second saut
# ajouterait un hop non fiable au calcul de X-Forwarded-For et
# invaliderait le "trust proxy: 1" posé côté NestJS (main.ts).
# ============================================================

server {
    # nginx écoute sur le port 80 dans le container.
    listen 80;

    # Masque la version nginx dans l'en-tête "Server" des réponses
    # (surface d'information en moins pour un attaquant).
    server_tokens off;

    # Borne la taille du corps de requête - nginx ne sert plus jamais
    # l'API (donc jamais de gros payload JSON), seuls les uploads
    # statiques via un éventuel formulaire HTML sont concernés.
    client_max_body_size 1m;

    # Dossier contenant les fichiers statiques Angular compilés
    # (copié depuis dist/apps/frontend/browser/ pendant le docker build)
    root /usr/share/nginx/html;
    index index.html;

    # ── Cache long sur les fichiers hachés (outputHashing: "all") ──
    # Le build Angular produit des noms du type main-FNBNQWKG.js,
    # styles-NIILSOFX.css, chunk-X76X5JTE.js : le contenu change ⇒ le
    # hash change ⇒ le nom de fichier change. Aucun risque de servir
    # une ancienne version sous un nom déjà mis en cache.
    location ~* "-[A-Za-z0-9]{8,}\.(js|css|woff2?|ttf|otf|eot|svg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── index.html : jamais mis en cache ──
    # C'est lui qui référence les fichiers hachés ci-dessus - un cache
    # navigateur sur index.html pourrait continuer à pointer vers des
    # bundles supprimés par le déploiement suivant.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # ── SPA fallback : support du routeur Angular ─────────────
    # Angular utilise le HTML5 History API (URLs sans #).
    # Sans ce fallback, nginx renverrait 404 pour toute URL
    # autre que "/" si l'utilisateur recharge la page ou accède
    # directement à /teams, /rules, etc.
    #
    # try_files : nginx cherche d'abord un fichier correspondant à
    # l'URL ($uri), puis un dossier ($uri/), et sinon retourne
    # index.html pour que Angular gère le routage.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
